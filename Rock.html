    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Photo Comparison Slider</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
      </head>
      <body>
        <div class="container mt-5">
          <h2 class="text-center">Photo Two Comparison</h2>
          <div id="photoComparison" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img src="rock.jpg" class="d-block w-100" alt="Before">
              </div>
              <div class="carousel-item">
                <img src="ROCKIE.jpg" class="d-block w-100" alt="After">
              </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#photoComparison" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#photoComparison" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
        </div>
    </body>
    <body>
      <div class="container mt-5">
        <h2 class="text-center mb-4">Glitched photos used</h2>
        <!-- Carousel -->
        <div id="manualCarousel" class="carousel slide" data-bs-ride="false">
          <!-- Indicators -->
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#manualCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#manualCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#manualCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
          
          </div>
    
          <!-- Carousel Items -->
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="Rock (2).png" class="d-block w-100" alt="Image 1">
            </div>
            <div class="carousel-item">
              <img src="Rock (3).png" class="d-block w-100" alt="Image 2">
            </div>
            <div class="carousel-item">
              <img src="Rock (4).png" class="d-block w-100" alt="Image 3">
            </div>
           
          </div>
    
          <!-- Controls -->
          <button class="carousel-control-prev" type="button" data-bs-target="#manualCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#manualCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </div>
    <style>
